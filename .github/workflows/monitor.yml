name: TicketScout Monitor

on:
  workflow_dispatch: # Allows instant manual trigger from GitHub UI anytime

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore Persistent State File
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: ticket-scout-state-${{ github.run_id }}
          restore-keys: |
            ticket-scout-state-

      - name: Install Dependencies & Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run TicketScout Monitor
        env:
          EVENT_URL: ${{ secrets.EVENT_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEADLESS: 'true'
        # Run instant check without in-process jitter sleep to minimize runner duration (~7s)
        run: npm run monitor

      - name: Save Updated State File
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: ticket-scout-state-${{ github.run_id }}
